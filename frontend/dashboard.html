<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — BorrowBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5C2 3.7 2.7 3 3.5 3H10a2 2 0 0 1 2 2v15a1.5 1.5 0 0 0-1.5-1.5H2Z"/><path d="M22 4.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v15a1.5 1.5 0 0 1 1.5-1.5H22Z"/></svg>
      BorrowBox
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
      <li><a href="books.html">Explore Books</a></li>
      <li><a href="borrowed.html">My Books</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <div class="nav-actions"></div>
    <button class="nav-toggle" aria-label="Toggle navigation menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<main class="app-shell">
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">Dashboard</span>
      <h1 id="welcome-heading">Welcome back</h1>
      <p>Here's a snapshot of everything you currently have checked out.</p>
    </div>

    <div class="card-grid" id="stat-cards">
      <div class="stat-card skeleton skeleton-card" style="height:120px;"></div>
      <div class="stat-card skeleton skeleton-card" style="height:120px;"></div>
      <div class="stat-card skeleton skeleton-card" style="height:120px;"></div>
      <div class="stat-card skeleton skeleton-card" style="height:120px;"></div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head">
          <h2>Recent activity</h2>
          <a href="borrowed.html" class="btn btn-ghost btn-sm">View all</a>
        </div>
        <div id="recent-activity">
          <div class="skeleton" style="height:52px; margin-bottom:10px;"></div>
          <div class="skeleton" style="height:52px; margin-bottom:10px;"></div>
          <div class="skeleton" style="height:52px;"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Quick actions</h2></div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <a href="books.html" class="btn btn-primary btn-block">Browse books</a>
          <a href="borrowed.html" class="btn btn-ghost btn-block">My borrowed books</a>
          <a href="profile.html" class="btn btn-ghost btn-block">Edit profile</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
  requireAuth();

  function statCardHtml(tone, iconSvg, value, label) {
    return `
      <div class="stat-card tone-${tone}">
        <div class="stat-top">
          <div class="stat-icon">${iconSvg}</div>
        </div>
        <div class="stat-value">${value}</div>
        <div class="stat-label">${label}</div>
      </div>`;
  }

  const ICONS = {
    borrowed: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',
    dueSoon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    returned: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
    overdue: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>',
  };

  function activityRowHtml(borrow) {
    const returned = borrow.status === 'returned';
    const text = returned
      ? `Returned <strong>${escapeHtml(borrow.book.title)}</strong>`
      : `Borrowed <strong>${escapeHtml(borrow.book.title)}</strong>`;
    const when = returned ? borrow.returnDate : borrow.borrowDate;
    return `
      <div class="activity-row">
        <div class="activity-icon">${returned ? ICONS.returned : ICONS.borrowed}</div>
        <div class="activity-text">${text}</div>
        <div class="activity-meta">${formatDate(when)}</div>
      </div>`;
  }

  async function loadDashboard() {
    const user = getCurrentUser();
    document.getElementById('welcome-heading').textContent = `Welcome back, ${user.name.split(' ')[0]}`;

    try {
      const res = await api.get('/borrow/my');
      const { borrows, summary } = res.data;

      document.getElementById('stat-cards').innerHTML = [
        statCardHtml('forest', ICONS.borrowed, summary.borrowed, 'Currently Borrowed'),
        statCardHtml('amber', ICONS.dueSoon, summary.dueSoon, 'Due Soon'),
        statCardHtml('brown', ICONS.returned, summary.returned, 'Returned'),
        statCardHtml('red', ICONS.overdue, summary.overdue, 'Overdue'),
      ].join('');

      const recentEl = document.getElementById('recent-activity');
      if (borrows.length === 0) {
        recentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${ICONS.borrowed}</div>
            <h3>No activity yet</h3>
            <p>Borrow your first book to see it show up here.</p>
          </div>`;
      } else {
        recentEl.innerHTML = borrows.slice(0, 6).map(activityRowHtml).join('');
      }
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadDashboard();
</script>
</body>
</html>
