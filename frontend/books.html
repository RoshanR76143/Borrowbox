<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Explore Books — BorrowBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5C2 3.7 2.7 3 3.5 3H10a2 2 0 0 1 2 2v15a1.5 1.5 0 0 0-1.5-1.5H2Z"/><path d="M22 4.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v15a1.5 1.5 0 0 1 1.5-1.5H22Z"/></svg>
      BorrowBox
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html" class="active">Explore Books</a></li>
      <li><a href="index.html#how-it-works">How It Works</a></li>
      <li><a href="index.html#about">About</a></li>
    </ul>
    <div class="nav-actions"></div>
    <button class="nav-toggle" aria-label="Toggle navigation menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<main class="app-shell">
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">The full catalog</span>
      <h1>Explore books</h1>
      <p>Search by title or author, filter by category, and sort the shelf however you like.</p>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search by title or author…" />
      </div>
      <select id="category-filter">
        <option value="All">All Categories</option>
        <option value="Fiction">Fiction</option>
        <option value="Technology">Technology</option>
        <option value="Business">Business</option>
        <option value="Self Development">Self Development</option>
        <option value="Science">Science</option>
        <option value="Biography">Biography</option>
      </select>
      <select id="sort-select">
        <option value="">Newest first</option>
        <option value="title-asc">Title (A–Z)</option>
        <option value="title-desc">Title (Z–A)</option>
        <option value="author-asc">Author (A–Z)</option>
        <option value="availability">Most available</option>
      </select>
    </div>

    <div class="book-grid" id="book-grid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
  const grid = document.getElementById('book-grid');
  const searchInput = document.getElementById('search-input');
  const categoryFilter = document.getElementById('category-filter');
  const sortSelect = document.getElementById('sort-select');

  const params = new URLSearchParams(window.location.search);
  if (params.get('category')) categoryFilter.value = params.get('category');

  let debounceTimer;

  function renderEmpty() {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h3>No books found</h3>
        <p>Try a different search term or category.</p>
      </div>`;
  }

  function renderError(message) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        </div>
        <h3>Couldn't load books</h3>
        <p>${escapeHtml(message)}</p>
      </div>`;
  }

  async function loadBooks() {
    grid.innerHTML = `<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>`;

    const query = new URLSearchParams();
    if (searchInput.value.trim()) query.set('search', searchInput.value.trim());
    if (categoryFilter.value && categoryFilter.value !== 'All') query.set('category', categoryFilter.value);
    if (sortSelect.value) query.set('sort', sortSelect.value);

    try {
      const res = await api.get(`/books?${query.toString()}`);
      const books = res.data.books;
      if (books.length === 0) return renderEmpty();
      grid.innerHTML = books.map(bookCardHtml).join('');
    } catch (err) {
      renderError(err.message);
    }
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadBooks, 350);
  });
  categoryFilter.addEventListener('change', loadBooks);
  sortSelect.addEventListener('change', loadBooks);

  document.addEventListener('borrowbox:borrowed', () => loadBooks());

  loadBooks();
</script>
</body>
</html>
