<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — BorrowBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="logo">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5C2 3.7 2.7 3 3.5 3H10a2 2 0 0 1 2 2v15a1.5 1.5 0 0 0-1.5-1.5H2Z"/><path d="M22 4.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v15a1.5 1.5 0 0 1 1.5-1.5H22Z"/></svg>
      BorrowBox
    </a>
    <div class="auth-quote">
      “A room without books is like a body without a soul.”
      <span>— Cicero, on the shelves you're about to browse</span>
    </div>
    <div></div>
  </div>

  <div class="auth-main">
    <div class="auth-form">
      <a href="index.html" class="auth-back">← Back to home</a>
      <span class="eyebrow">Welcome back</span>
      <h1>Log in to BorrowBox</h1>
      <p>Pick up right where you left off.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          <span class="error-msg"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <span class="error-msg"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <p class="form-foot">New to BorrowBox? <a href="register.html">Create an account</a></p>
      </form>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
